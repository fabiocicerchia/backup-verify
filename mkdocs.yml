site_name: backup-verify
site_description: Restores the latest backup into a scratch container on a schedule and runs smoke queries.
repo_url: https://github.com/fabiocicerchia/backup-verify
docs_dir: docs

theme:
  name: material
  palette:
    - scheme: default
      toggle: { icon: material/weather-night, name: Dark mode }
    - scheme: slate
      toggle: { icon: material/weather-sunny, name: Light mode }

nav:
  - Home: README.md
  - Getting Started: getting-started.md
  - Plan Reference: plan-reference.md
  - Architecture: architecture.md

markdown_extensions:
  - admonition
  - pymdownx.superfences
