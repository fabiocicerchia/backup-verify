name: Release

# release-please reads Conventional Commit messages on main and keeps an open
# "release PR" ("chore: release X.Y.Z") that bumps the version in pyproject.toml
# and updates CHANGELOG.md. Merging that PR (and only that) creates the vX.Y.Z
# tag + GitHub Release, which then triggers the build and PyPI publish below.
#
# Publishing to PyPI is opt-in: configure a Trusted Publisher for this
# repository on pypi.org (workflow: release.yml, environment: pypi) and set
# the repository variable PUBLISH_TO_PYPI to "true".

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create tags & releases
      pull-requests: write # open/update the release PR
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7  # v5.0.0
        id: rp
        with:
          # "python" bumps pyproject.toml's version and maintains CHANGELOG.md.
          # Manifest mode: release-please-config.json sets `draft: true` so the
          # GitHub Release is created unpublished. Immutable releases reject asset
          # uploads once a release is published, so assets must land while it is
          # still a draft; a later step flips it to published.
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # upload sdist + wheel to the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          pip install --require-hashes -r requirements-release.txt
          python -m build
      - name: Upload assets to the release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228  # v3.0.2
        with:
          tag_name: ${{ needs.release-please.outputs.tag_name }}
          files: dist/*
          # Keep the release unpublished until the assets are attached:
          # immutable releases reject uploads to a published release.
          draft: true
      - name: Publish the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ needs.release-please.outputs.tag_name }}" --draft=false --repo "$GITHUB_REPOSITORY"

  pypi:
    needs: [release-please, build]
    if: needs.release-please.outputs.release_created == 'true' && vars.PUBLISH_TO_PYPI == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          pip install --require-hashes -r requirements-release.txt
          python -m build
      - name: Publish to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
