# Backstage catalog entry, read by paved's scorecard plugin.
#
# Every check paved scores is derived from this file alone — no cluster
# access, no CI credentials. What is absent here is absent from the score.
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: backup-verify
  description: >-
      Automated backup integrity verifier — runs restore probes in isolated containers on a schedule and
      reports metrics. Trust, but verify.
  annotations:
    github.com/project-slug: fabiocicerchia/backup-verify
    backstage.io/source-location: url:https://github.com/fabiocicerchia/backup-verify/
    backstage.io/techdocs-ref: dir:.
  links:
    - url: https://github.com/fabiocicerchia/backup-verify
      title: Source
spec:
  type: library
  lifecycle: production
  owner: group:default/kodebeat
  system: oss-tools
